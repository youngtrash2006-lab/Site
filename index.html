<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>СРО по DevOps — Развертывание проекта</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%);
            color: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .wrapper {
            background: #ffffff0d;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 550px;
            width: 100%;
        }
        h1 {
            color: #00d2d3;
            font-size: 26px;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }
        p {
            color: #c8d6e5;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .status-box {
            display: inline-block;
            background-color: #ff9f43;
            color: #1e1e2f;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>Самостоятельная работа студента</h1>
        <p>Веб-ресурс успешно контейнеризирован с помощью Docker и развернут в облачной инфраструктуре.</p>
        <div class="status-box">Система активна ✔</div>
    </div>
</body>
</html>
